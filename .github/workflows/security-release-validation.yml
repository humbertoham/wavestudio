name: Security and release validation

on:
  pull_request:
  push:
    branches:
      - main
      - security/main-dependency-hardening
      - release/wellhub-production-security
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Deterministic installation without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit
      - name: Isolated PostgreSQL regression, Prisma, typecheck and production build
        run: npm run test:security:release
